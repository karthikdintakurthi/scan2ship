name: CI

on:
  pull_request:
  push:
    branches: [main, feature/mcp-implementation]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (no errors, no new warnings)
        run: npm run lint:ci
      - name: Type check
        run: npm run typecheck
      - name: Tests
        # Parallel workers crash loading the Next SWC binary; run in band.
        run: npm run test:ci
